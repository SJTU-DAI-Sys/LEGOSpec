[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legospec"
dynamic = ["version"]
description = "Composable speculative decoding with shared training and inference."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "accelerate",
    "causal-conv1d==1.7.0",
    "datasets",
    "flash-linear-attention[conv1d]==0.5.2",
    "huggingface-hub",
    "loguru",
    "ninja",
    "numpy",
    "openai-harmony",
    "packaging",
    "psutil",
    "pydantic",
    "PyYAML>=6.0",
    "qwen-vl-utils==0.0.11",
    "rich",
    "safetensors",
    "sglang==0.5.21",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchvision==0.28.0",
    "transformers==5.12.1",
    "tqdm",
    "typing-extensions",
    "wandb",
    "yunchang",
]

[project.urls]
Repository = "https://github.com/alexwhz-sjtu/LEGOSpec"
Issues = "https://github.com/alexwhz-sjtu/LEGOSpec/issues"

[project.optional-dependencies]
# FLA gated-delta backward on Hopper with the PyTorch 2.13 Triton pin.
hopper = ["tilelang==0.1.12; sys_platform == 'linux'"]
fa = ["flash-attn"]
cu130 = ["torch==2.13.0", "torchaudio==2.11.0", "torchvision==0.28.0", "sglang-kernel==0.4.7"]

[dependency-groups]
test = ["pytest", "ruff"]
dev = [
    { include-group = "test" },
    "build",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["legospec*"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.uv]
preview = true
prerelease = "allow"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.extra-build-dependencies]
# This CUDA extension must use the exact PyTorch C++ ABI selected by the lock.
causal-conv1d = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
causal-conv1d = { CAUSAL_CONV1D_FORCE_BUILD = "TRUE" }

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
norecursedirs = ["development", "archive", "reference", "artifacts", "stage", "__pycache__", "*_20*"]
